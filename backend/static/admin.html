<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#043074">
<title>Panel BOMAR · Cotizaciones del chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--azul:#043074;--azul2:#28508f;--rojo:#ed1c24;--fondo:#f3f6fb;--linea:#d8e0ec;--texto:#0f1d33;--suave:#56647c;--verde:#1f9d55;--blanco:#fff}
  *{box-sizing:border-box}
  body{margin:0;font-family:Montserrat,Helvetica,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:15px;line-height:1.5}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--azul2)}
  :focus-visible{outline:3px solid var(--rojo);outline-offset:2px}
  [hidden]{display:none!important}

  /* Acceso */
  .login{max-width:380px;margin:12vh auto;padding:0 18px}
  .login .caja{background:#fff;border-radius:14px;padding:28px;box-shadow:0 10px 30px rgba(4,48,116,.12)}
  .login h1{margin:0 0 4px;font-size:1.4rem;color:var(--azul)}
  .login p{margin:0 0 18px;color:var(--suave);font-size:.92rem}
  label{display:block;font-weight:600;font-size:.88rem;margin:12px 0 6px}
  input[type=text],input[type=password],input[type=number],input[type=search],select,textarea{width:100%;padding:10px 12px;border:1px solid var(--linea);border-radius:9px;background:#fff}
  textarea{resize:vertical;min-height:70px}
  .chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:.9rem}
  .chk input{width:18px;height:18px}
  .err{color:#b3261e;font-weight:600;font-size:.9rem;min-height:1.3em;margin-top:10px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--azul);background:#fff;color:var(--azul);font-weight:600;font-size:.9rem;padding:9px 14px;border-radius:9px;cursor:pointer;text-decoration:none;white-space:nowrap}
  .btn:hover{background:var(--azul);color:#fff}
  .btn.primario{background:var(--rojo);border-color:var(--rojo);color:#fff}
  .btn.primario:hover{background:#c8141b}
  .btn.azul{background:var(--azul);color:#fff}
  .btn.verde{background:var(--verde);border-color:var(--verde);color:#fff}
  .btn.verde:hover{background:#17804a}
  .btn.chico{padding:6px 10px;font-size:.82rem}
  .btn.peligro{border-color:#b3261e;color:#b3261e}
  .btn.peligro:hover{background:#b3261e;color:#fff}
  .btn.ancho{width:100%}

  /* Estructura */
  .top{position:sticky;top:0;z-index:20;background:var(--azul);color:#fff}
  .top .fila{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .marca{font-weight:800;letter-spacing:.02em;font-size:1.05rem}
  .marca small{display:block;font-weight:500;font-size:.75rem;opacity:.8;letter-spacing:0}
  .top .btn{border-color:rgba(255,255,255,.5);background:transparent;color:#fff}
  .top .btn:hover{background:rgba(255,255,255,.15)}
  .tabs{max-width:1100px;margin:0 auto;padding:0 10px;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
  .tab{border:0;background:transparent;color:rgba(255,255,255,.75);font-weight:600;padding:10px 12px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
  .tab[aria-selected=true]{color:#fff;border-bottom-color:var(--rojo)}
  .badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--rojo);color:#fff;font-size:.75rem;line-height:20px;text-align:center}
  main{max-width:1100px;margin:0 auto;padding:16px}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .stat{background:#fff;border-radius:12px;padding:14px;border:1px solid var(--linea)}
  .stat b{display:block;font-size:1.6rem;color:var(--azul);line-height:1.15}
  .stat span{color:var(--suave);font-size:.82rem}
  .stat.alerta b{color:var(--rojo)}

  .barra{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .barra input[type=search]{flex:1;min-width:200px}
  .filtros{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:thin}
  .filtro{border:1px solid var(--linea);background:#fff;border-radius:999px;padding:6px 12px;font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap;color:var(--suave)}
  .filtro[aria-pressed=true]{background:var(--azul);border-color:var(--azul);color:#fff}

  .lista{display:grid;gap:12px}
  .card{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px}
  .card.nueva{border-left:5px solid var(--rojo)}
  .cab{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
  .folio{font-weight:800;color:var(--azul);font-size:1.05rem}
  .fecha{color:var(--suave);font-size:.82rem}
  .nombre{font-weight:700;font-size:1.08rem;margin:8px 0 0}
  .nombre a{color:inherit;text-decoration:none}
  .nombre a:hover{text-decoration:underline}
  .meta{color:var(--suave);font-size:.88rem}
  .acciones{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
  .bloque{margin-top:10px}
  .bloque h4{margin:0 0 3px;font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--suave)}
  .bloque p,.bloque pre{margin:0;white-space:pre-wrap;font-family:inherit}
  .total{margin-top:10px;padding:10px 12px;background:var(--fondo);border-radius:10px;font-weight:700}
  .total small{display:block;font-weight:500;color:var(--suave)}
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.78rem;font-weight:700;text-transform:capitalize}
  .pill.nueva{background:#fde3e4;color:#a3121a}
  .pill.contactado{background:#e1ecff;color:#1a428a}
  .pill.cotizado{background:#fff1d6;color:#8a5a00}
  .pill.cerrada{background:#d9f3e5;color:#14532d}
  .pill.descartada{background:#eceff3;color:#56647c}
  .gestion{display:grid;grid-template-columns:180px 1fr;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed var(--linea);align-items:start}
  .gestion .acc{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
  .ok{color:var(--verde);font-weight:600;font-size:.85rem}
  .vacio{text-align:center;color:var(--suave);background:#fff;border:1px dashed var(--linea);border-radius:14px;padding:30px 16px}

  .hilo{display:flex;flex-direction:column;gap:8px;background:#fff;border:1px solid var(--linea);border-radius:14px;padding:14px}
  .m{max-width:82%;padding:9px 12px;border-radius:12px;white-space:pre-wrap;font-size:.93rem}
  .m small{display:block;opacity:.65;font-size:.74rem;margin-top:3px}
  .m.cliente{align-self:flex-end;background:var(--azul);color:#fff;border-bottom-right-radius:4px}
  .m.bot{align-self:flex-start;background:var(--fondo);border:1px solid var(--linea);border-bottom-left-radius:4px}

  .form{background:#fff;border:1px solid var(--linea);border-radius:14px;padding:16px;margin-bottom:16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
  .form .ancho{grid-column:1/-1}
  .form .acc{grid-column:1/-1;display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .precio{font-weight:700;color:var(--azul)}
  .inactivo{opacity:.55}
  .aviso{background:#fff8e1;border:1px solid #f1d27a;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:.9rem}
  .aviso.bien{background:#e8f6ee;border-color:#9fd8b6}

  @media (max-width:640px){
    main{padding:12px}
    .gestion{grid-template-columns:1fr}
    .top .btn span{display:none}
    .m{max-width:92%}
  }
</style>
</head>
<body>

<div id="login" class="login">
  <div class="caja">
    <h1>Panel de BOMAR</h1>
    <p>Clientes y cotizaciones que llegan por el chat de bomar.mx</p>
    <form id="f-login">
      <label for="pw">Contraseña</label>
      <input id="pw" type="password" autocomplete="current-password" required>
      <div class="chk"><input id="recordar" type="checkbox" checked><label for="recordar" style="margin:0;font-weight:500">Recordarme en este dispositivo</label></div>
      <div class="err" id="err" role="alert"></div>
      <button class="btn primario ancho" type="submit">Entrar</button>
    </form>
  </div>
</div>

<div id="app" hidden>
  <header class="top">
    <div class="fila">
      <div class="marca">BOMAR <small>Panel del chat</small></div>
      <div style="display:flex;gap:8px">
        <button class="btn chico" id="exportar" type="button" title="Descargar todas las cotizaciones en Excel (CSV)">⬇ <span>Exportar</span></button>
        <button class="btn chico" id="salir" type="button">Salir</button>
      </div>
    </div>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-t="cot" aria-selected="true">Cotizaciones <span class="badge" id="b-nuevas" hidden></span></button>
      <button class="tab" role="tab" data-t="cli" aria-selected="false">Clientes</button>
      <button class="tab" role="tab" data-t="conv" aria-selected="false">Conversaciones</button>
      <button class="tab" role="tab" data-t="pre" aria-selected="false">Servicios y precios</button>
      <button class="tab" role="tab" data-t="aj" aria-selected="false">Ajustes</button>
    </nav>
  </header>
  <main id="vista" aria-live="polite"></main>
</div>

<script>
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = (t) => String(t ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const dinero = (n) => n == null ? "—" : "$" + Number(n).toLocaleString("es-MX", {minimumFractionDigits: 2, maximumFractionDigits: 2}) + " MXN";
  const rango = (a, b) => (b == null || b === a) ? dinero(a) : dinero(a) + " a " + dinero(b);
  const fecha = (iso) => { const d = new Date(iso); return isNaN(d) ? esc(iso) : d.toLocaleString("es-MX", {dateStyle: "medium", timeStyle: "short"}); };
  const telBonito = (t) => (t && t.length === 10) ? t.replace(/(\d{2})(\d{4})(\d{4})/, "$1 $2 $3") : (t || "");
  const wa = (t) => "https://wa.me/" + (t.length === 10 ? "52" + t : t);
  const ESTADOS = [["nueva","Nueva"],["contactado","Contactado"],["cotizado","Cotizado"],["cerrada","Cerrada (ganada)"],["descartada","Descartada"]];

  const vista = $("#vista");
  let pw = "";
  try { pw = localStorage.getItem("bomar_admin") || sessionStorage.getItem("bomar_admin") || ""; } catch (e) {}
  let tabActual = "cot";
  let filtroEstado = "";
  let textoBuscar = "";

  async function api(ruta, opciones = {}) {
    const res = await fetch(ruta, {
      ...opciones,
      headers: {"Content-Type": "application/json", "X-Admin-Password": pw, ...(opciones.headers || {})},
    });
    if (res.status === 401) { salir(); throw new Error("La contraseña ya no es válida. Vuelve a entrar."); }
    if (!res.ok) {
      let msg = "Error " + res.status;
      try { const j = await res.json(); if (j.detail) msg = typeof j.detail === "string" ? j.detail : "Datos inválidos."; } catch (e) {}
      throw new Error(msg);
    }
    return res;
  }
  const getJSON = async (ruta) => (await api(ruta)).json();

  function guardarPw(recordar) {
    try {
      localStorage.removeItem("bomar_admin"); sessionStorage.removeItem("bomar_admin");
      (recordar ? localStorage : sessionStorage).setItem("bomar_admin", pw);
    } catch (e) {}
  }

  function salir() {
    pw = "";
    try { localStorage.removeItem("bomar_admin"); sessionStorage.removeItem("bomar_admin"); } catch (e) {}
    $("#app").hidden = true; $("#login").hidden = false; $("#pw").value = ""; $("#pw").focus();
  }

  $("#f-login").addEventListener("submit", async (e) => {
    e.preventDefault();
    pw = $("#pw").value;
    $("#err").textContent = "Verificando…";
    try {
      await api("/admin/resumen");
      guardarPw($("#recordar").checked);
      $("#err").textContent = "";
      entrar();
    } catch (err) {
      $("#err").textContent = err.message === "Failed to fetch" ? "No se pudo conectar con el servidor." : err.message;
    }
  });
  $("#salir").addEventListener("click", salir);

  $("#exportar").addEventListener("click", async () => {
    try {
      const blob = await (await api("/admin/export.csv")).blob();
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "cotizaciones-bomar-" + new Date().toISOString().slice(0, 10) + ".csv";
      a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    } catch (err) { alert(err.message); }
  });

  $$(".tab").forEach((b) => b.addEventListener("click", () => irA(b.dataset.t)));

  function irA(t, ...args) {
    tabActual = t;
    $$(".tab").forEach((x) => x.setAttribute("aria-selected", x.dataset.t === t));
    window.scrollTo({top: 0});
    mostrar(t, ...args);
  }

  async function mostrar(t, ...args) {
    vista.innerHTML = '<p class="vacio">Cargando…</p>';
    try {
      if (t === "cot") await vistaCotizaciones();
      if (t === "cli") await (args[0] ? vistaCliente(args[0]) : vistaClientes());
      if (t === "conv") await (args[0] ? vistaHilo(args[0]) : vistaConversaciones());
      if (t === "pre") await vistaPrecios();
      if (t === "aj") await vistaAjustes();
    } catch (err) { vista.innerHTML = '<p class="vacio">' + esc(err.message) + "</p>"; }
  }

  function entrar() {
    $("#login").hidden = true; $("#app").hidden = false;
    irA("cot");
    actualizarBadge();
  }

  async function actualizarBadge() {
    try {
      const r = await getJSON("/admin/resumen");
      const b = $("#b-nuevas");
      b.hidden = !r.nuevas; b.textContent = r.nuevas;
      document.title = (r.nuevas ? "(" + r.nuevas + ") " : "") + "Panel BOMAR · Cotizaciones del chat";
      return r;
    } catch (e) { return null; }
  }
  // Revisa cada minuto si llegaron cotizaciones nuevas
  setInterval(() => { if (pw && !$("#app").hidden) actualizarBadge(); }, 60000);

  /* ---------------- Tarjeta de contacto ---------------- */
  function botonesContacto(nombre, tel, correo, folio) {
    let h = '<div class="acciones">';
    if (tel) {
      h += '<a class="btn azul" href="tel:' + esc(tel) + '">📞 Llamar</a>';
      const texto = encodeURIComponent("Hola " + (nombre || "").split(" ")[0] + ", le saluda BOMAR" + (folio ? " sobre su solicitud " + folio : "") + ".");
      h += '<a class="btn verde" target="_blank" rel="noopener" href="' + esc(wa(tel)) + "?text=" + texto + '">WhatsApp</a>';
    }
    if (correo) h += '<a class="btn" href="mailto:' + esc(correo) + "?subject=" + encodeURIComponent("Cotización " + (folio || "") + " · BOMAR") + '">✉ Correo</a>';
    return h + "</div>";
  }

  function tarjetaCotizacion(s) {
    const opciones = ESTADOS.map(([v, t]) => '<option value="' + v + '"' + (s.estado === v ? " selected" : "") + ">" + t + "</option>").join("");
    const totalTxt = s.total == null ? "Sin aproximado · pendiente tu cotización final"
      : "Aproximado: " + rango(s.total, s.total_max);
    return '<article class="card' + (s.estado === "nueva" ? " nueva" : "") + '" data-id="' + s.id + '">' +
      '<div class="cab"><div><div class="folio">' + esc(s.folio) + '</div><div class="fecha">' + fecha(s.creado) + "</div></div>" +
      '<span class="pill ' + esc(s.estado) + '">' + esc(s.estado) + "</span></div>" +
      '<div class="nombre"><a href="#" data-cliente="' + s.cliente_id + '">' + esc(s.cliente_nombre) + "</a></div>" +
      '<div class="meta">' + esc(telBonito(s.cliente_telefono)) + (s.cliente_empresa ? " · " + esc(s.cliente_empresa) : "") + (s.cliente_correo ? " · " + esc(s.cliente_correo) : "") + "</div>" +
      botonesContacto(s.cliente_nombre, s.cliente_telefono, s.cliente_correo, s.folio) +
      '<div class="bloque"><h4>Servicio</h4><p>' + esc(s.servicio || "—") + "</p></div>" +
      (s.ubicacion ? '<div class="bloque"><h4>Ubicación</h4><p>' + esc(s.ubicacion) + "</p></div>" : "") +
      '<div class="bloque"><h4>Lo que necesita</h4><p>' + esc(s.descripcion || "—") + "</p></div>" +
      '<div class="bloque"><h4>Pre-cotización</h4><pre>' + esc(s.detalle || "—") + "</pre></div>" +
      '<div class="total">' + esc(totalTxt) + (s.total != null ? "<small>Referencia que vio el cliente, más IVA" + (s.requiere_revision ? " · hay conceptos sin aproximado" : "") + "</small>" : "") + "<small>La cotización real y final se la das tú al comunicarte con el cliente.</small>" + "</div>" +
      '<div class="gestion">' +
        '<div><label for="e' + s.id + '">Estado</label><select id="e' + s.id + '" class="sel-estado">' + opciones + "</select></div>" +
        '<div><label for="n' + s.id + '">Notas internas</label><textarea id="n' + s.id + '" class="notas" placeholder="Ej. Le llamé el martes, pidió visita técnica">' + esc(s.notas) + "</textarea></div>" +
        '<div class="acc"><div style="display:flex;gap:8px;align-items:center"><button class="btn chico primario guardar" type="button">Guardar</button><span class="ok" hidden>Guardado</span></div>' +
        '<div style="display:flex;gap:8px">' + (s.session_id ? '<button class="btn chico ver-chat" type="button" data-s="' + esc(s.session_id) + '">Ver conversación</button>' : "") +
        '<button class="btn chico peligro borrar" type="button">Borrar</button></div></div>' +
      "</div></article>";
  }

  function conectarTarjetas(cont, recargar) {
    $$("[data-cliente]", cont).forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); irA("cli", a.dataset.cliente); }));
    $$(".ver-chat", cont).forEach((b) => b.addEventListener("click", () => irA("conv", b.dataset.s)));
    $$("article.card[data-id]", cont).forEach((card) => {
      const id = card.dataset.id;
      const guardar = async () => {
        const estado = $(".sel-estado", card).value;
        const notas = $(".notas", card).value;
        try {
          await api("/admin/solicitudes/" + id, {method: "PATCH", body: JSON.stringify({estado, notas})});
          const ok = $(".ok", card); ok.hidden = false; setTimeout(() => ok.hidden = true, 2000);
          const pill = $(".pill", card); pill.className = "pill " + estado; pill.textContent = estado;
          card.classList.toggle("nueva", estado === "nueva");
          actualizarBadge();
        } catch (err) { alert(err.message); }
      };
      $(".guardar", card).addEventListener("click", guardar);
      $(".sel-estado", card).addEventListener("change", guardar);
      $(".borrar", card).addEventListener("click", async () => {
        if (!confirm("¿Borrar esta cotización? No se puede deshacer.")) return;
        try { await api("/admin/solicitudes/" + id, {method: "DELETE"}); recargar(); actualizarBadge(); }
        catch (err) { alert(err.message); }
      });
    });
  }

  /* ---------------- Cotizaciones ---------------- */
  async function vistaCotizaciones() {
    const r = await actualizarBadge() || {};
    vista.innerHTML =
      '<div class="stats">' +
        '<div class="stat' + (r.nuevas ? " alerta" : "") + '"><b>' + (r.nuevas ?? 0) + '</b><span>Nuevas sin atender</span></div>' +
        '<div class="stat"><b>' + (r.solicitudes_hoy ?? 0) + '</b><span>Cotizaciones hoy</span></div>' +
        '<div class="stat"><b>' + (r.solicitudes_mes ?? 0) + '</b><span>Este mes</span></div>' +
        '<div class="stat"><b>' + (r.clientes ?? 0) + '</b><span>Clientes registrados</span></div>' +
      "</div>" +
      '<div class="barra"><input type="search" id="buscar" placeholder="Buscar por folio, nombre, teléfono, empresa o servicio" value="' + esc(textoBuscar) + '"></div>' +
      '<div class="filtros" role="group" aria-label="Filtrar por estado">' +
        [["", "Todas"]].concat(ESTADOS).map(([v, t]) => '<button class="filtro" type="button" data-e="' + v + '" aria-pressed="' + (filtroEstado === v) + '">' + t.replace(" (ganada)", "") + "</button>").join("") +
      "</div>" +
      '<div class="lista" id="lista"><p class="vacio">Cargando…</p></div>';

    const cargar = async () => {
      const q = new URLSearchParams({estado: filtroEstado, buscar: textoBuscar});
      const lista = await getJSON("/admin/solicitudes?" + q);
      const cont = $("#lista");
      if (!lista.length) {
        cont.innerHTML = '<p class="vacio">' + (textoBuscar || filtroEstado ? "No hay cotizaciones con ese filtro." : "Todavía no hay cotizaciones. Aparecerán aquí en cuanto un cliente deje la suya en el chat.") + "</p>";
        return;
      }
      cont.innerHTML = lista.map(tarjetaCotizacion).join("");
      conectarTarjetas(cont, cargar);
    };
    $$(".filtro").forEach((b) => b.addEventListener("click", () => {
      filtroEstado = b.dataset.e;
      $$(".filtro").forEach((x) => x.setAttribute("aria-pressed", x === b));
      cargar().catch((e) => $("#lista").innerHTML = '<p class="vacio">' + esc(e.message) + "</p>");
    }));
    let t;
    $("#buscar").addEventListener("input", (e) => {
      clearTimeout(t);
      t = setTimeout(() => { textoBuscar = e.target.value.trim(); cargar().catch(() => {}); }, 350);
    });
    await cargar();
  }

  /* ---------------- Clientes ---------------- */
  async function vistaClientes() {
    vista.innerHTML =
      '<div class="barra"><input type="search" id="bcli" placeholder="Buscar cliente por nombre, teléfono, empresa o correo"></div>' +
      '<div class="lista" id="lcli"><p class="vacio">Cargando…</p></div>';
    const cargar = async (b = "") => {
      const lista = await getJSON("/admin/clientes?" + new URLSearchParams({buscar: b}));
      const cont = $("#lcli");
      if (!lista.length) { cont.innerHTML = '<p class="vacio">' + (b ? "Sin resultados." : "Todavía no hay clientes registrados.") + "</p>"; return; }
      cont.innerHTML = lista.map((c) =>
        '<article class="card">' +
          '<div class="cab"><div class="nombre" style="margin:0"><a href="#" data-cliente="' + c.id + '">' + esc(c.nombre) + "</a></div>" +
          (c.pendientes ? '<span class="pill nueva">' + c.pendientes + " nueva" + (c.pendientes > 1 ? "s" : "") + "</span>" : "") + "</div>" +
          '<div class="meta">' + esc(telBonito(c.telefono)) + (c.empresa ? " · " + esc(c.empresa) : "") + (c.correo ? " · " + esc(c.correo) : "") + "</div>" +
          '<div class="meta">' + c.solicitudes + " cotizaci" + (c.solicitudes === 1 ? "ón" : "ones") + (c.ultima_solicitud ? " · última: " + fecha(c.ultima_solicitud) : "") + "</div>" +
          botonesContacto(c.nombre, c.telefono, c.correo, "") +
          '<button class="btn chico" type="button" data-cliente="' + c.id + '">Ver ficha del cliente</button>' +
        "</article>").join("");
      $$("[data-cliente]", cont).forEach((a) => a.addEventListener("click", (e) => { e.preventDefault(); irA("cli", a.dataset.cliente); }));
    };
    let t;
    $("#bcli").addEventListener("input", (e) => { clearTimeout(t); t = setTimeout(() => cargar(e.target.value.trim()).catch(() => {}), 350); });
    await cargar();
  }

  async function vistaCliente(id) {
    const c = await getJSON("/admin/clientes/" + encodeURIComponent(id));
    vista.innerHTML =
      '<button class="btn chico" id="atras" type="button">← Todos los clientes</button>' +
      '<article class="card" style="margin-top:12px">' +
        '<div class="nombre" style="margin:0;font-size:1.3rem">' + esc(c.nombre) + "</div>" +
        '<div class="meta">' + esc(telBonito(c.telefono)) + (c.empresa ? " · " + esc(c.empresa) : "") + (c.correo ? " · " + esc(c.correo) : "") + "</div>" +
        '<div class="meta">Cliente desde ' + fecha(c.creado) + "</div>" +
        botonesContacto(c.nombre, c.telefono, c.correo, "") +
        '<label for="ncli">Notas sobre el cliente</label><textarea id="ncli" placeholder="Ej. Prefiere que le llamen por la tarde">' + esc(c.notas) + "</textarea>" +
        '<div style="display:flex;gap:8px;align-items:center;margin-top:8px"><button class="btn chico primario" id="gncli" type="button">Guardar notas</button><span class="ok" id="okcli" hidden>Guardado</span></div>' +
      "</article>" +
      '<h3 style="margin:20px 0 10px;color:var(--azul)">Cotizaciones de este cliente (' + c.solicitudes.length + ")</h3>" +
      '<div class="lista" id="lcot"></div>';
    $("#atras").addEventListener("click", () => irA("cli"));
    $("#gncli").addEventListener("click", async () => {
      try {
        await api("/admin/clientes/" + c.id, {method: "PATCH", body: JSON.stringify({notas: $("#ncli").value})});
        $("#okcli").hidden = false; setTimeout(() => $("#okcli").hidden = true, 2000);
      } catch (err) { alert(err.message); }
    });
    const cont = $("#lcot");
    if (!c.solicitudes.length) { cont.innerHTML = '<p class="vacio">Este cliente todavía no ha registrado cotizaciones.</p>'; return; }
    const datos = {cliente_id: c.id, cliente_nombre: c.nombre, cliente_telefono: c.telefono, cliente_correo: c.correo, cliente_empresa: c.empresa};
    cont.innerHTML = c.solicitudes.map((s) => tarjetaCotizacion({...s, ...datos})).join("");
    conectarTarjetas(cont, () => vistaCliente(id));
  }

  /* ---------------- Conversaciones ---------------- */
  async function vistaConversaciones() {
    const s = await getJSON("/admin/sesiones");
    if (!s.length) { vista.innerHTML = '<p class="vacio">Todavía no hay conversaciones.</p>'; return; }
    vista.innerHTML = '<div class="lista">' + s.map((x) =>
      '<article class="card" style="cursor:pointer" data-s="' + esc(x.session_id) + '">' +
        '<div class="cab"><div><b>' + esc(x.cliente_nombre || "Visitante sin registrar") + "</b>" +
        (x.cliente_telefono ? ' <span class="meta">· ' + esc(telBonito(x.cliente_telefono)) + "</span>" : "") + "</div>" +
        (x.solicitudes ? '<span class="pill cerrada">' + x.solicitudes + " cotizaci" + (x.solicitudes === 1 ? "ón" : "ones") + "</span>" : '<span class="pill descartada">Sin cotización</span>') + "</div>" +
        '<div class="meta">' + fecha(x.ultimo) + " · " + x.mensajes + " mensajes</div>" +
        '<div style="margin-top:6px">“' + esc((x.primer_mensaje || "").slice(0, 120)) + "”</div>" +
      "</article>").join("") + "</div>";
    $$("[data-s]").forEach((el) => el.addEventListener("click", () => irA("conv", el.dataset.s)));
  }

  async function vistaHilo(sid) {
    const m = await getJSON("/admin/sesiones/" + encodeURIComponent(sid));
    vista.innerHTML = '<button class="btn chico" id="atras" type="button">← Todas las conversaciones</button>' +
      '<div class="hilo" style="margin-top:12px">' +
      (m.length ? m.map((x) => '<div class="m ' + esc(x.remitente) + '">' + esc(x.mensaje) + "<small>" + (x.remitente === "cliente" ? "Cliente" : "Asistente") + " · " + fecha(x.fecha) + "</small></div>").join("") : '<p class="meta">Sin mensajes.</p>') +
      "</div>";
    $("#atras").addEventListener("click", () => irA("conv"));
  }

  /* ---------------- Servicios y precios ---------------- */
  async function vistaPrecios() {
    const s = await getJSON("/admin/servicios");
    const precioTxt = (x) => x.tipo_precio === "manual" || x.precio == null ? "Sin aproximado · el chat no da cifras"
      : "Aproximado: " + rango(x.precio, x.precio_max) + " por " + esc(x.unidad);
    vista.innerHTML =
      '<div class="aviso">El chat nunca da la cotización final: esa la das tú al comunicarte con el cliente. Si quieres que el chat dé una <b>referencia</b>, pon un aproximado (mínimo y máximo, sin IVA). Si lo dejas en "Sin aproximado", el chat no menciona cifras. Los cambios aplican de inmediato.</div>' +
      '<form class="form" id="fs"><input type="hidden" id="sid">' +
        '<div class="ancho"><label for="sn">Servicio</label><input id="sn" type="text" maxlength="120" required placeholder="Ej. Prueba de relevadores de protección"></div>' +
        '<div class="ancho"><label for="sd">Descripción corta</label><input id="sd" type="text" maxlength="500" placeholder="Qué incluye"></div>' +
        '<div><label for="st">¿El chat da un aproximado?</label><select id="st"><option value="manual">Sin aproximado (no da cifras)</option><option value="aproximado">Sí, un rango aproximado</option></select></div>' +
        '<div><label for="sp">Aproximado mínimo MXN</label><input id="sp" type="number" min="0" step="0.01" placeholder="0.00"></div>' +
        '<div><label for="sx">Aproximado máximo MXN</label><input id="sx" type="number" min="0" step="0.01" placeholder="opcional"></div>' +
        '<div><label for="su">Por cada…</label><input id="su" type="text" maxlength="40" value="servicio" placeholder="servicio, equipo, km, m2…"></div>' +
        '<div class="chk"><input id="sa" type="checkbox" checked><label for="sa" style="margin:0">Activo (el bot lo ofrece)</label></div>' +
        '<div class="acc"><button class="btn primario" type="submit" id="guardar">Agregar servicio</button><button class="btn" type="button" id="cancelar" hidden>Cancelar edición</button></div>' +
        '<div class="err ancho" id="serr"></div>' +
      "</form>" +
      '<div class="lista">' + s.map((x) =>
        '<article class="card' + (x.activo ? "" : " inactivo") + '">' +
          '<div class="cab"><b>' + esc(x.nombre) + "</b>" + (x.activo ? "" : '<span class="pill descartada">Inactivo</span>') + "</div>" +
          '<div class="meta">' + esc(x.descripcion) + "</div>" +
          '<div class="precio" style="margin-top:6px">' + precioTxt(x) + "</div>" +
          '<div class="acciones" style="margin-bottom:0"><button class="btn chico" data-e="' + x.id + '" type="button">Editar</button>' +
          '<button class="btn chico peligro" data-b="' + x.id + '" type="button">Borrar</button></div>' +
        "</article>").join("") + "</div>";

    const porId = Object.fromEntries(s.map((x) => [x.id, x]));
    const sincronizarPrecio = () => { const manual = $("#st").value === "manual"; ["#sp", "#sx"].forEach((q) => { $(q).disabled = manual; if (manual) $(q).value = ""; }); };
    $("#st").addEventListener("change", sincronizarPrecio); sincronizarPrecio();
    const limpiar = () => { $("#fs").reset(); $("#sid").value = ""; $("#su").value = "servicio"; $("#guardar").textContent = "Agregar servicio"; $("#cancelar").hidden = true; sincronizarPrecio(); };
    $("#cancelar").addEventListener("click", limpiar);

    $("#fs").addEventListener("submit", async (e) => {
      e.preventDefault();
      const cuerpo = {
        nombre: $("#sn").value.trim(), descripcion: $("#sd").value.trim(),
        tipo_precio: $("#st").value, precio: $("#sp").value === "" ? null : parseFloat($("#sp").value),
        precio_max: $("#sx").value === "" ? null : parseFloat($("#sx").value),
        unidad: $("#su").value.trim() || "servicio", activo: $("#sa").checked,
      };
      try {
        const id = $("#sid").value;
        await api(id ? "/admin/servicios/" + id : "/admin/servicios", {method: id ? "PUT" : "POST", body: JSON.stringify(cuerpo)});
        vistaPrecios();
      } catch (err) { $("#serr").textContent = err.message; }
    });
    $$("[data-e]").forEach((b) => b.addEventListener("click", () => {
      const x = porId[b.dataset.e];
      $("#sid").value = x.id; $("#sn").value = x.nombre; $("#sd").value = x.descripcion || "";
      $("#st").value = x.tipo_precio === "manual" ? "manual" : "aproximado"; $("#sp").value = x.precio ?? ""; $("#sx").value = x.precio_max ?? ""; $("#su").value = x.unidad || "servicio"; $("#sa").checked = !!x.activo;
      sincronizarPrecio();
      $("#guardar").textContent = "Guardar cambios"; $("#cancelar").hidden = false;
      window.scrollTo({top: 0, behavior: "smooth"}); $("#sn").focus();
    }));
    $$("[data-b]").forEach((b) => b.addEventListener("click", async () => {
      if (!confirm("¿Borrar este servicio? El bot dejará de ofrecerlo. Si solo quieres pausarlo, edítalo y desmarca 'Activo'.")) return;
      try { await api("/admin/servicios/" + b.dataset.b, {method: "DELETE"}); vistaPrecios(); }
      catch (err) { $("#serr").textContent = err.message; }
    }));
  }

  /* ---------------- Ajustes ---------------- */
  async function vistaAjustes() {
    const r = await getJSON("/admin/resumen");
    vista.innerHTML =
      '<div class="aviso' + (r.correo_configurado ? " bien" : "") + '"><b>Avisos por correo:</b> ' +
        (r.correo_configurado ? "activados. Cada cotización nueva llega por correo." : "no configurados. Faltan las variables de correo en Render.") + "</div>" +
      '<div class="aviso' + (r.disco_permanente ? " bien" : "") + '"><b>Almacenamiento:</b> ' +
        (r.disco_permanente ? "disco permanente, los datos no se borran." : "temporal. Configura DB_PATH con el disco de Render para no perder datos.") + "</div>" +
      '<article class="card"><b>Probar correo</b><p class="meta" style="margin:4px 0 10px">Manda un correo de prueba a la dirección de avisos.</p>' +
        '<button class="btn primario" id="probar" type="button">Enviar correo de prueba</button><div class="err" id="rprueba" style="color:inherit"></div></article>' +
      '<article class="card" style="margin-top:12px"><b>Este mes</b><p class="meta" style="margin:4px 0 0">' +
        r.conversaciones_mes + " conversaciones · " + r.solicitudes_mes + " solicitudes de cotización</p></article>";
    $("#probar").addEventListener("click", async () => {
      $("#rprueba").textContent = "Enviando…";
      try { const j = await (await api("/admin/probar-correo", {method: "POST"})).json(); $("#rprueba").textContent = j.mensaje; }
      catch (err) { $("#rprueba").textContent = err.message; }
    });
  }

  if (pw) { api("/admin/resumen").then(entrar).catch(() => {}); } else { $("#pw").focus(); }
})();
</script>
</body>
</html>
